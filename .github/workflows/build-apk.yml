name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35"

      - name: Unpack project
        run: unzip MignonBrewLogAndroid-AndroidStudio.zip -d source

      - name: Build APK
        uses: gradle/gradle-build-action@v
